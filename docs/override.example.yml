# Copie para docker-compose.override.yml (gitignored) no host do deploy.
# App e home publica em https://social.bigworks.com.br (sem container landing separado).
# Hostnames Traefik e segredos: ajuste no override local / Vault — nao chumbados no git.

networks:
  traefik:
    external: true

services:
  postiz:
    # Node 22.23.4 sobre a imagem oficial; ver Dockerfile.postiz.
    image: bigworks/postiz-app:node-22.23.4
    build:
      context: .
      dockerfile: Dockerfile.postiz
    pull_policy: build
    volumes:
      - ./scripts/patch-landing-home.sh:/patch-landing-home.sh:ro
      - ./landing:/landing-src:ro
    environment:
      MAIN_URL: "https://social.bigworks.com.br"
      FRONTEND_URL: "https://social.bigworks.com.br"
      NEXT_PUBLIC_BACKEND_URL: "https://social.bigworks.com.br/api"
      NEXT_PUBLIC_POSTIZ_OAUTH_LOGO_URL: "https://social.bigworks.com.br/bigworks-icon.png"
    labels:
      - "traefik.http.routers.postiz.rule=Host(`social.bigworks.com.br`) || Host(`postiz.jarbas.bigworks.com.br`)"
      - "traefik.http.routers.postiz-staging.rule=Host(`social.staging.bigworks.com.br`)"
      - "traefik.http.routers.postiz-staging.service=postiz"
