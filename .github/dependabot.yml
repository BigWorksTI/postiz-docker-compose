# Imagens base Docker e do compose (security release do Node, 2026-10-22).
# Um PR agrupado por ecossistema, no máximo 1 aberto de cada, para não
# entupir o runner. Bump major (ex.: Node 22 -> 24) fica para decisão manual.
version: 2
updates:
  - package-ecosystem: docker
    directories:
      - "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      docker:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      docker-compose:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
