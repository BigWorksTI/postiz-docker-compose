name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: [self-hosted, stage-vps]
    steps:
      - uses: actions/checkout@v4
      - name: validate
        run: ./scripts/validate.sh

  trivy:
    runs-on: [self-hosted, stage-vps]
    steps:
      - uses: actions/checkout@v4
      - name: build postiz-app
        run: docker build -f Dockerfile.postiz --pull -t postiz-app:ci .
      - name: trivy (reprova com CRITICAL que tenha correção)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache aquasec/trivy:0.58.1 image \
            --severity CRITICAL --ignore-unfixed --exit-code 1 postiz-app:ci
